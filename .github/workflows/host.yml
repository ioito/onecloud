name: Host docker image

on:
  push:
    branches:
    - master
    - releases/*

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.14
      uses: actions/setup-go@v1
      with:
        go-version: 1.14
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@v1

    - name: Build
      run: |
        sudo apt-get update
        sudo apt-get install alien # baremetal-agent needs this
        pwd
        sudo alien .ceph/*.rpm
        make cmd/host cmd/host-deployer

    - name: Image host
      uses: elgohr/Publish-Docker-Github-Action@master
      with:
        name: registry.cn-beijing.aliyuncs.com/quxuan/host
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        registry: registry.cn-beijing.aliyuncs.com
        snapshot: true
        dockerfile: build/docker/Dockerfile.host

    - name: Image host-deployer
      uses: elgohr/Publish-Docker-Github-Action@master
      with:
        name: registry.cn-beijing.aliyuncs.com/quxuan/host-deployer
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
        registry: registry.cn-beijing.aliyuncs.com
        snapshot: true
        dockerfile: build/docker/Dockerfile.host-deployer
